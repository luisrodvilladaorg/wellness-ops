<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Ops - Dashboard</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/templatemo-style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="fas fa-notes-medical me-2"></i>
                Wellness Ops
            </a>
            <div id="navbar-user" class="ms-auto d-none d-flex align-items-center text-white">
                <span id="user-info" class="me-3"></span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="tm-hero d-flex justify-content-center align-items-center" data-parallax="scroll"
        data-image-src="img/hero.jpg">
        <h1 class="text-white">Wellness Journal v3</h1>
    </div>

    <div class="container-fluid tm-container-content tm-mt-60">

        <div class="row mb-5">
            <div class="col-12">
                <h2 class="tm-text-primary">Latest Entries</h2>
                <ul id="entries-list" class="list-group mt-3"></ul>
            </div>
        </div>

        <div class="row mb-5">
            <div class="col-md-8 col-lg-6">
                <h3 class="tm-text-primary mb-3">Add New Entry</h3>
                <form id="entry-form">
                    <input id="entry-title" class="form-control mb-2" placeholder="Title" required />
                    <textarea id="entry-description" class="form-control mb-3" placeholder="Description"></textarea>
                    <button type="submit" class="btn btn-success">Save entry</button>
                </form>
            </div>
        </div>

    </div>

    <div style="min-height: 120px;"></div>
