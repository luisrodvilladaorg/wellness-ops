services:

  # ==========================
  # Nginx Reverse Proxy
  # ==========================
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.dev
    container_name: nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - web_net
      - backend_net
    restart: unless-stopped

  # ==========================
  # Backend API
  # ==========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend
    ports:
      - "3000:3000"
    env_file:
      - env/dev/.env
    depends_on:
      - postgres
    networks:
      - backend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ==========================
  # PostgreSQL Database
  # ==========================
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    env_file:
      - env/dev/.env
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

# ==========================
# Networks
# ==========================
networks:
  web_net:
    driver: bridge
  backend_net:
    driver: bridge

# ==========================
# Volumes
# ==========================
volumes:
  db-data:
